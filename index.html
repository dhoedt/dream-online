<script>
  const tabs = [...document.querySelectorAll('[role="tab"]')];

  // L'onglet actif est gardé dans l'URL (#lessons, #exercises…) pour survivre au retour arrière.
  function selectTab(panelId) {
    for (const tab of tabs) {
      const isSelected = tab.getAttribute('aria-controls') === panelId;
      tab.setAttribute('aria-selected', String(isSelected));
      tab.tabIndex = isSelected ? 0 : -1;
      document.getElementById(tab.getAttribute('aria-controls')).hidden = !isSelected;
    }
    history.replaceState(null, '', `#${panelId}`);
  }

  function panelIdFromHash() {
    const hashId = location.hash.slice(1);
    const hasTab = tabs.some((tab) => tab.getAttribute('aria-controls') === hashId);
    return hasTab ? hashId : tabs[0].getAttribute('aria-controls');
  }

  for (const tab of tabs) {
    tab.addEventListener('click', () => selectTab(tab.getAttribute('aria-controls')));
    tab.addEventListener('keydown', (event) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
      if (!step) {
        return;
      }
      const nextTab = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length];
      selectTab(nextTab.getAttribute('aria-controls'));
      nextTab.focus();
    });
  }

  selectTab(panelIdFromHash());
</script>
